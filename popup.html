<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup-body">
  <main class="popup-shell">
    <p class="eyebrow">SERP Intelligence</p>
    <h1>SEO Radar</h1>
    <p class="intro">
      Google arama sonucundaki rakipleri topla, sayfa bazli SEO sinyallerini tara ve
      nis filtrelerine gore guclu bir rakip listesi olustur.
    </p>

    <section class="context-card">
      <div class="context-row">
        <span>Aktif sayfa</span>
        <strong id="pageContext">Kontrol ediliyor...</strong>
      </div>
      <div class="context-row">
        <span>Google sorgusu</span>
        <strong id="detectedQuery">Algilaniyor...</strong>
      </div>
    </section>

    <form id="scanForm" class="control-stack">
      <label class="field">
        <span>Ek filtre anahtar kelime</span>
        <input
          type="text"
          id="focusKeyword"
          placeholder="Ornek: spor"
          autocomplete="off"
        >
      </label>

      <label class="field">
        <span>Taranacak maksimum sonuc</span>
        <input
          type="number"
          id="maxResults"
          min="5"
          max="20"
          step="1"
          value="10"
        >
      </label>

      <label class="checkbox-field">
        <input type="checkbox" id="strictMode" checked>
        <span>Sadece temel sorgu + ek filtre birlikte eslesen rakipleri one cikar</span>
      </label>

      <button id="scanBtn" type="submit">Rakipleri Tara</button>
    </form>

    <p id="status" class="status status-info">
      Bu arac en iyi Google sonuc sayfasindayken calisir.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
